[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtpl"
version = "0.1.0"
description = "Claim frequency pricing model for French motor liability insurance (freMTPL2)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ashton" }]
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1.1",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "rdata>=0.11",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
